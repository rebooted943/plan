<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plan Nutrițional 1500 kcal</title>
    <style>
        :root {
            --bg-color: #fcf4f6; /* Roz pastel foarte deschis */
            --card-bg: #ffffff;
            --text-primary: #2d2a2b;
            --text-secondary: #6b6366;
            --accent: #e57399; /* Roz pastel accent */
            --accent-light: #fce4ec;
            --border: #f0dadd;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        header {
            background: var(--card-bg);
            padding: 16px 16px 0;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 2px 10px rgba(229, 115, 153, 0.1);
        }

        h1 {
            font-size: 24px;
            margin: 0 0 12px;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brownie-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Navigare Zile */
        .days-nav {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding-bottom: 12px;
            scrollbar-width: none;
        }
        
        .days-nav::-webkit-scrollbar {
            display: none;
        }

        .day-tab {
            background: var(--accent-light);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 20px;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .day-tab.active {
            background: var(--accent);
            color: white;
        }

        main {
            padding: 16px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        .meal-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(229, 115, 153, 0.08);
            border: 1px solid var(--border);
        }

        .meal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .meal-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meal-code {
            background: var(--accent-light);
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .meal-macros {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            background: #f5f5f5;
            padding: 4px 8px;
            border-radius: 8px;
            text-align: right;
        }

        .meal-desc {
            font-size: 15px;
            margin: 8px 0;
        }

        .tag-btn {
            background-color: var(--accent-light);
            color: var(--accent);
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        /* Bottom Sheet Modal */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            max-height: 85vh;
            background: var(--card-bg);
            border-radius: 24px 24px 0 0;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1);
            z-index: 101;
            display: flex;
            flex-direction: column;
        }

        .bottom-sheet.active {
            transform: translateY(0);
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .sheet-header h2 {
            margin: 0;
            font-size: 18px;
            color: var(--accent);
        }

        .close-btn {
            background: var(--accent-light);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 16px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            cursor: pointer;
        }

        .sheet-content {
            padding: 16px 20px;
            overflow-y: auto;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .alt-item {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        
        .alt-item.urgency {
            background: #fff8e1;
            border-radius: 8px;
            border: 1px solid #ffe082;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <span>Dieta 1500 kcal</span>
            <button class="brownie-btn" onclick="openRecipe()">Rețetă Brownie</button>
        </h1>
        <div class="days-nav" id="daysNav">
            <!-- Tabs generate via JS -->
        </div>
    </header>

    <main id="app-content">
        <!-- Continut generat via JS -->
    </main>

    <div class="overlay" id="overlay" onclick="closeSheet()"></div>
    
    <!-- Modal Alternative -->
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-header">
            <h2 id="sheetTitle">Alternative</h2>
            <button class="close-btn" onclick="closeSheet()">&times;</button>
        </div>
        <div class="sheet-content" id="sheetContent"></div>
    </div>

    <script>
        // Setări de baze și referințe calorice pentru interschimbabilitate
        const macrosGuide = {
            "C": "Ghid: ~300 kcal | 25g P | 30g C | 8g F",
            "S1": "Ghid: ~120 kcal | 4g P | 10g C | 8g F",
            "P": "Ghid: ~380 kcal | 32g P | 35g C | 12g F",
            "S2": "Ghid: ~160 kcal | 18g P | 15g C | 3g F",
            "CEN": "Ghid: ~440 kcal | 38g P | 25g C | 18g F"
        };

        const alternativesData = {
            "C_MicDejun": [
                "<strong>[C1] Omletă Dietetică:</strong> 1 ou întreg + 150g albuș bătute spumă, 150g spanac (la tigaie), 2 felii Wasa.",
                "<strong>[C2] Cereale Proteice:</strong> 40g cereale cu proteine (Lidl/Kaufland) + 150g iaurt grecesc 2%.",
                "<strong>[C3] Iaurt Bowl:</strong> 150g iaurt grecesc 2%, 30g ovăz, 80g fructe de pădure, 10g migdale.",
                "<strong>[C4] Pancakes:</strong> 40g ovăz, 150g albuș, 10g cacao (tigaie) + 10g unt de arahide deasupra.",
                "URGENȚĂ: 1 iaurt de băut proteic (Pilos) + 1 banană + 15g migdale."
            ],
            "S1_Gustare1": [
                "20g migdale sau nuci.",
                "1 măr sau pară mare (150g).",
                "15g semințe de dovleac.",
                "URGENȚĂ: 1 măr + 10g caju de la mega image."
            ],
            "P_Pranz": [
                "<strong>[P1] Salată Creveți (La rece):</strong> 150g creveți (fierți/trași rapid la tigaie seara), 3 felii Wasa, castraveți, 10g ulei măsline.",
                "<strong>[P2] Salată Rapidă:</strong> 150g năut fiert, 1 conservă ton (112g), roșii cherry, 5g ulei.",
                "<strong>[P3] Salată Somon:</strong> 50g somon afumat, 150g perle de brânză, castravete, 3 felii Wasa.",
                "<strong>[P4] Resturi Cină:</strong> Păstrăv/Tofu/Creveți rămași + legume + 3 felii Wasa.",
                "URGENȚĂ: Salată la pungă + 1 conservă pește/ton cu deschidere rapidă + 4 felii Wasa."
            ],
            "S2_Gustare2": [
                "<strong>[B1] Tigaie-Brownie Proteic:</strong> (Vezi rețeta sus). Poate fi făcut de cu seară și ținut la frigider.",
                "<strong>[B2] Iaurt Dulce:</strong> 150g iaurt grecesc 2% cu scorțișoară, îndulcitor și 10g nuci.",
                "URGENȚĂ: 1 baton proteic low-sugar (50g) de la Lidl/Kaufland."
            ],
            "CEN_Cina": [
                "<strong>[CEN1] Creveți Tigaie:</strong> 200g creveți decorticați, 200g fasole verde, usturoi, 10g ulei + 2 felii Wasa.",
                "<strong>[CEN2] Păstrăv Tigaie/Cuptor:</strong> 200g file/pește păstrăv, 250g dovlecei rondele, 5g ulei + 2 felii Wasa.",
                "<strong>[CEN3] Tofu Rapid:</strong> 150g tofu, 200g ardei gras, sos de soia, 10g ulei + 2 felii Wasa.",
                "<strong>[CEN4] Somon la Cuptor:</strong> 130g somon, 200g broccoli, lămâie + 1 felie Wasa.",
                "URGENȚĂ: 200g perle brânză + 100g somon afumat + 1 roșie mare + 2 felii Wasa."
            ]
        };

        const reteaBrownie = `
            <strong>Ingrediente (1 porție ~ 160 kcal, 18g Proteine):</strong><br>
            - 20g făină de ovăz (sau ovăz mărunțit)<br>
            - 100g albuș de ou lichid<br>
            - 10g cacao pudră<br>
            - 50g iaurt grecesc 2% (sau piure de mere pt textură)<br>
            - 1/2 linguriță praf de copt<br>
            - Îndulcitor (stevia/eritritol) după gust<br><br>
            <strong>Preparare (5 minute):</strong><br>
            1. Amestecă totul într-un bol până devine o pastă groasă.<br>
            2. Încinge o tigaie mică antiaderentă (foc mic/mediu) cu o picătură de ulei ștearsă cu șervețelul.<br>
            3. Toarnă compoziția (ca un pancake gros), pune un capac și lasă 3-4 minute până se coagulează deasupra. Întoarce-l încă 1 minut.<br>
            4. Se poate păstra perfect la frigider 2-3 zile într-o caserolă și luat la școală.
        `;

        // Generare plan 14 zile
        const days = [];
        const pattern = [
            { c: "C1", s1: "S1", p: "P2", s2: "B1", cen: "CEN2" }, // Ziua 1
            { c: "C2", s1: "S1", p: "P4", s2: "B2", cen: "CEN1" }, // Ziua 2
            { c: "C3", s1: "S1", p: "P1", s2: "B1", cen: "CEN3" }, // Ziua 3
            { c: "C4", s1: "S1", p: "P4", s2: "B1", cen: "CEN2" }, // Ziua 4
            { c: "C1", s1: "S1", p: "P3", s2: "B2", cen: "CEN4" }, // Ziua 5
            { c: "C2", s1: "S1", p: "P4", s2: "B1", cen: "CEN1" }, // Ziua 6
            { c: "C4", s1: "S1", p: "P1", s2: "B1", cen: "CEN2" }  // Ziua 7
        ];

        for (let i = 1; i <= 14; i++) {
            const p = pattern[(i - 1) % 7];
            days.push({
                day: i,
                meals: [
                    { type: "Mic Dejun", cat: "C_MicDejun", code: p.c, macros: macrosGuide["C"] },
                    { type: "Gustare 1", cat: "S1_Gustare1", code: p.s1, macros: macrosGuide["S1"] },
                    { type: "Prânz", cat: "P_Pranz", code: p.p, macros: macrosGuide["P"] },
                    { type: "Gustare 2", cat: "S2_Gustare2", code: p.s2, macros: macrosGuide["S2"] },
                    { type: "Cină", cat: "CEN_Cina", code: p.cen, macros: macrosGuide["CEN"] }
                ]
            });
        }

        let currentDay = 1;

        function init() {
            renderTabs();
            renderDay(1);
        }

        function renderTabs() {
            const nav = document.getElementById('daysNav');
            let tabsHtml = '';
            for (let i = 1; i <= 14; i++) {
                tabsHtml += `<button class="day-tab ${i === 1 ? 'active' : ''}" onclick="selectDay(${i})" id="tab-${i}">Ziua ${i}</button>`;
            }
            nav.innerHTML = tabsHtml;
        }

        function selectDay(dayNum) {
            document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${dayNum}`).classList.add('active');
            
            // Auto-scroll tab in view
            document.getElementById(`tab-${dayNum}`).scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            
            renderDay(dayNum);
        }

        function getDescFromCode(cat, code) {
            const options = alternativesData[cat];
            const matched = options.find(opt => opt.includes(`[${code}]`));
            if(matched) return matched.replace(/<strong>\[.*?\]<\/strong>/, '').trim();
            return options[0];
        }

        function renderDay(dayNum) {
            const container = document.getElementById('app-content');
            const dayData = days[dayNum - 1];
            
            let html = `
                <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                    <h2 style="margin:0; font-size:20px; color:var(--text-primary);">Meniul Zilei ${dayNum}</h2>
                    <span style="background:var(--accent); color:white; padding:4px 10px; border-radius:12px; font-weight:bold; font-size:14px;">~1500 kcal</span>
                </div>
            `;

            dayData.meals.forEach(meal => {
                html += `
                    <div class="meal-card">
                        <div class="meal-header">
                            <h3 class="meal-title">${meal.type} <span class="meal-code" onclick="openAlternatives('${meal.cat}')">${meal.code}</span></h3>
                            <div class="meal-macros">${meal.macros}</div>
                        </div>
                        <div class="meal-desc">
                            ${getDescFromCode(meal.cat, meal.code)}
                        </div>
                        <button class="tag-btn" onclick="openAlternatives('${meal.cat}')">🔄 Schimbă masa (${meal.type})</button>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function openAlternatives(cat) {
            const alts = alternativesData[cat];
            document.getElementById('sheetTitle').innerText = `Alternative`;
            
            const content = document.getElementById('sheetContent');
            content.innerHTML = '';
            
            alts.forEach(alt => {
                const isUrgency = alt.includes("URGENȚĂ");
                const cleanAlt = alt.replace("URGENȚĂ:", "<strong>⚡ OPȚIUNE SUPERMARKET (Rapid):</strong>");
                content.innerHTML += `<div class="alt-item ${isUrgency ? 'urgency' : ''}">${cleanAlt}</div>`;
            });

            document.getElementById('overlay').classList.add('active');
            document.getElementById('bottomSheet').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function openRecipe() {
            document.getElementById('sheetTitle').innerText = `Tigaie-Brownie Proteic`;
            const content = document.getElementById('sheetContent');
            content.innerHTML = `<div class="alt-item" style="font-size:15px; line-height:1.6;">${reteaBrownie}</div>`;
            
            document.getElementById('overlay').classList.add('active');
            document.getElementById('bottomSheet').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeSheet() {
            document.getElementById('overlay').classList.remove('active');
            document.getElementById('bottomSheet').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
